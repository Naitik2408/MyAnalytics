<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Analytics — Full Web Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <style>
    /* Exact Typography System: Urbanist */
    body, * {
      font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    /* Semantic Colors from Color.kt & Theme.kt */
    :root {
      --la-canvas: #F4F3F9;
      --la-surface: #FFFFFF;
      --la-surface-variant: #EFEDF6;
      --la-ink: #111A1C;
      --la-on-ink: #FFFFFF;
      --la-text-primary: #111A1C;
      --la-text-secondary: #5C586B;
      --la-on-tint-secondary: #3E3A52;
      --la-accent: #7563D8;
      --la-outline: #E2DEED;
      --la-lavender-strong: #D3C1F3;
      --la-lavender-base: #DDD0F7;
      --la-lavender-soft: #EFEAFC;
    }
  </style>
</head>
<body class="bg-[#0B0F19] text-[#111A1C] min-h-screen flex flex-col items-center justify-center p-2 sm:p-6 selection:bg-[#7563D8] selection:text-white">

  <!-- Desktop Control Header -->
  <header class="w-full max-w-4xl mb-4 flex flex-wrap items-center justify-between gap-3 px-4 py-2.5 bg-[#171E2E]/90 backdrop-blur-md rounded-2xl border border-slate-700/60 text-white shadow-xl">
    <div class="flex items-center gap-2.5">
      <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs sm:text-sm font-bold tracking-tight">Life Analytics — Pixel-Perfect Web Clone</span>
      <span class="text-[10px] bg-[#7563D8] text-white px-2 py-0.5 rounded-full font-bold">Matching Native Android App</span>
    </div>

    <!-- Quick Navigation Shortcuts on Desktop -->
    <div class="flex items-center gap-1.5 text-xs">
      <button onclick="navigateTo('home')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">Home</button>
      <button onclick="navigateTo('health')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">Health</button>
      <button onclick="navigateTo('career')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">Career</button>
      <button onclick="navigateTo('finance')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">Finance</button>
      <button onclick="navigateTo('planning')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">Planning</button>
      <button onclick="navigateTo('habits')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">Habits</button>
      <button onclick="navigateTo('review')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">Review</button>
      <button onclick="navigateTo('settings')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-slate-200">Settings</button>
      <button onclick="resetPrototypeData()" class="ml-2 px-2.5 py-1 bg-rose-950/80 hover:bg-rose-900 text-rose-300 rounded font-medium">Reset Data</button>
    </div>
  </header>

  <!-- Mobile Device Shell / Wrapper -->
  <div id="deviceContainer" class="w-[390px] h-[844px] bg-[#F4F3F9] rounded-[44px] shadow-2xl border-[8px] border-[#111A1C] flex flex-col overflow-hidden relative transition-all duration-300">
    
    <!-- Android Native Status Bar -->
    <div class="pt-2 px-6 flex justify-between items-center text-xs font-semibold text-[#111A1C] select-none bg-[#FFFFFF] z-10">
      <span class="text-[11px] font-bold">09:49</span>
      <div class="flex items-center gap-2">
        <span class="text-[10px] text-[#5C586B] font-medium">4.00 KB/s</span>
        <span class="text-[10px] text-[#5C586B] font-bold">5G</span>
        <div class="w-5 h-2.5 border border-[#111A1C] rounded-[3px] p-0.5 flex items-center">
          <div class="h-full w-4/5 bg-[#111A1C] rounded-[1px]"></div>
        </div>
        <span class="text-[10px] font-bold">48</span>
      </div>
    </div>

    <!-- Top App Bar with back navigation when not on a primary bottom tab -->
    <div id="subScreenHeader" class="hidden px-5 py-2.5 bg-[#FFFFFF] border-b border-[#E2DEED] flex items-center justify-between z-10">
      <button onclick="navigateBack()" class="flex items-center gap-1.5 text-xs font-bold text-[#111A1C] hover:text-[#7563D8]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>Back</span>
      </button>
      <span id="subScreenTitle" class="text-xs font-bold text-[#111A1C]">Screen</span>
      <div class="w-8"></div>
    </div>

    <!-- Active Screen Viewport (Scrollable with 128px bottom clearance for floating dock) -->
    <div id="screenViewport" class="flex-1 overflow-y-auto custom-scroll pb-32 space-y-3">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Bottom Dock Scrim + Floating Dock -->
    <div id="dockContainer" class="absolute bottom-0 left-0 right-0 pointer-events-none z-20">
      <!-- 32dp vertical fade scrim -->
      <div class="w-full h-8 bg-gradient-to-t from-[#F4F3F9]/92 to-transparent"></div>
      
      <!-- Floating Dock -->
      <div class="bg-[#F4F3F9]/95 px-5 pb-4 pt-1 pointer-events-auto">
        <nav id="bottomNavBar" class="w-full h-[62px] bg-[#FFFFFF] rounded-full px-4 flex justify-between items-center shadow-lg border border-[#E2DEED]/70">
          
          <!-- Home Tab -->
          <button onclick="navigateTo('home')" id="tab-home" class="tab-btn flex flex-col items-center gap-0.5 group">
            <div class="tab-icon w-12 h-7 rounded-full bg-[#111A1C] text-white flex items-center justify-center transition-all">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>
            <span class="tab-label text-[10px] font-bold text-[#111A1C]">Home</span>
          </button>

          <!-- Health Tab -->
          <button onclick="navigateTo('health')" id="tab-health" class="tab-btn flex flex-col items-center gap-0.5 group">
            <div class="tab-icon w-10 h-7 flex items-center justify-center text-[#5C586B] group-hover:text-[#111A1C] transition-all">
              <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
            </div>
            <span class="tab-label text-[10px] font-medium text-[#5C586B] group-hover:text-[#111A1C]">Health</span>
          </button>

          <!-- Career Tab -->
          <button onclick="navigateTo('career')" id="tab-career" class="tab-btn flex flex-col items-center gap-0.5 group">
            <div class="tab-icon w-10 h-7 flex items-center justify-center text-[#5C586B] group-hover:text-[#111A1C] transition-all">
              <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            </div>
            <span class="tab-label text-[10px] font-medium text-[#5C586B] group-hover:text-[#111A1C]">Career</span>
          </button>

          <!-- Finance Tab -->
          <button onclick="navigateTo('finance')" id="tab-finance" class="tab-btn flex flex-col items-center gap-0.5 group">
            <div class="tab-icon w-10 h-7 flex items-center justify-center text-[#5C586B] group-hover:text-[#111A1C] transition-all">
              <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
            </div>
            <span class="tab-label text-[10px] font-medium text-[#5C586B] group-hover:text-[#111A1C]">Finance</span>
          </button>

        </nav>
      </div>
    </div>

    <!-- Modal Dialog -->
    <div id="modalOverlay" class="hidden absolute inset-0 bg-[#111A1C]/60 backdrop-blur-xs z-30 flex items-end justify-center transition-all">
      <div id="modalCard" class="w-full bg-[#FFFFFF] rounded-t-3xl p-5 shadow-2xl border-t border-[#E2DEED] max-h-[85%] overflow-y-auto space-y-4"></div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden absolute top-14 left-1/2 -translate-x-1/2 bg-[#111A1C] text-white text-xs px-4 py-2 rounded-full shadow-lg z-40 flex items-center gap-2">
      <span id="toastMsg">Action completed</span>
    </div>

  </div>

  <!-- Client-side Interactive Application Logic -->
  <script>
    // Navigation Stack
    const navStack = ['home'];
    let currentScreen = 'home';

    // Core Data Models
    const initialHabits = [
      { id: 'h1', name: '2L Water', area: 'Health', schedule: 'Every day', frequency: 'Daily', completed: true },
      { id: 'h2', name: '5k steps', area: 'Health', schedule: 'Mon, Tue, Wed, Thu, Fri', frequency: 'Weekdays', completed: true },
      { id: 'h3', name: 'Morning Cold Shower', area: 'Health', schedule: 'Every day', frequency: 'Daily', completed: false },
      { id: 'h4', name: 'Min 7 hours sleep', area: 'Health', schedule: 'Every day', frequency: 'Daily', completed: false },
      { id: 'h5', name: 'Read 20 mins', area: 'Career', schedule: 'Every day', frequency: 'Daily', completed: true },
      { id: 'h6', name: 'English speaking practice', area: 'Career', schedule: 'Mon-Fri', frequency: 'Weekdays', completed: false },
      { id: 'h7', name: 'Weekly budget review', area: 'Finance', schedule: 'Sundays', frequency: 'Weekly', completed: false },
    ];

    const initialTasks = [
      { id: 't1', title: 'Complete project architecture document', area: 'Career', category: 'Work', time: '10:00 AM', completed: true },
      { id: 't2', title: 'Review monthly savings and expenses', area: 'Finance', category: 'Personal', time: '02:30 PM', completed: false },
      { id: 't3', title: 'Practice 2 algorithm design problems', area: 'Career', category: 'Study', time: '04:00 PM', completed: false },
      { id: 't4', title: '30-minute cardio and mobility routine', area: 'Health', category: 'Personal', time: '06:00 PM', completed: false },
    ];

    const initialExpenses = [
      { id: 'e1', title: 'Organic Market & Groceries', amount: 3200, category: 'Food & Dining', type: 'Expense', date: '19 Nov 2026' },
      { id: 'e2', title: 'Gym & Fitness Membership', amount: 2500, category: 'Health', type: 'Expense', date: '18 Nov 2026' },
      { id: 'e3', title: 'High-speed Fiber Broadband', amount: 1499, category: 'Utilities', type: 'Expense', date: '16 Nov 2026' },
      { id: 'e4', title: 'Client Consulting Retainer', amount: 85000, category: 'Income', type: 'Income', date: '01 Nov 2026' },
    ];

    let habits = JSON.parse(localStorage.getItem('la_habits')) || initialHabits;
    let tasks = JSON.parse(localStorage.getItem('la_tasks')) || initialTasks;
    let expenses = JSON.parse(localStorage.getItem('la_expenses')) || initialExpenses;
    let dailyReviewNotes = localStorage.getItem('la_daily_review') || "Productive day! Kept up with hydration and finished the system architecture docs.";
    let dailyMood = localStorage.getItem('la_daily_mood') || "Great";
    let monthlyBudget = parseInt(localStorage.getItem('la_monthly_budget')) || 45000;

    function saveState() {
      localStorage.setItem('la_habits', JSON.stringify(habits));
      localStorage.setItem('la_tasks', JSON.stringify(tasks));
      localStorage.setItem('la_expenses', JSON.stringify(expenses));
      localStorage.setItem('la_daily_review', dailyReviewNotes);
      localStorage.setItem('la_daily_mood', dailyMood);
      localStorage.setItem('la_monthly_budget', monthlyBudget);
    }

    function resetPrototypeData() {
      habits = JSON.parse(JSON.stringify(initialHabits));
      tasks = JSON.parse(JSON.stringify(initialTasks));
      expenses = JSON.parse(JSON.stringify(initialExpenses));
      dailyReviewNotes = "Productive day! Kept up with hydration and finished the system architecture docs.";
      dailyMood = "Great";
      monthlyBudget = 45000;
      saveState();
      renderCurrentScreen();
      showToast('All sample data reset to default');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2000);
    }

    // Navigation Logic
    const primaryPillars = ['home', 'health', 'career', 'finance'];

    function navigateTo(screen) {
      if (currentScreen === screen) return;
      navStack.push(screen);
      currentScreen = screen;
      updateNavigationUI();
      renderCurrentScreen();
    }

    function navigateBack() {
      if (navStack.length > 1) {
        navStack.pop();
        currentScreen = navStack[navStack.length - 1];
        updateNavigationUI();
        renderCurrentScreen();
      } else {
        navigateTo('home');
      }
    }

    function updateNavigationUI() {
      const isPrimary = primaryPillars.includes(currentScreen);
      const subHeader = document.getElementById('subScreenHeader');
      const subTitle = document.getElementById('subScreenTitle');
      const bottomNav = document.getElementById('bottomNavBar');

      if (isPrimary) {
        subHeader.classList.add('hidden');
        bottomNav.classList.remove('hidden');

        // Update Bottom Bar Tabs
        primaryPillars.forEach(p => {
          const btn = document.getElementById(`tab-${p}`);
          const iconDiv = btn.querySelector('.tab-icon');
          const label = btn.querySelector('.tab-label');

          if (p === currentScreen) {
            iconDiv.className = "tab-icon w-12 h-7 rounded-full bg-[#111A1C] text-white flex items-center justify-center transition-all shadow-xs";
            label.className = "tab-label text-[10px] font-bold text-[#111A1C]";
          } else {
            iconDiv.className = "tab-icon w-10 h-7 flex items-center justify-center text-[#5C586B] group-hover:text-[#111A1C] transition-all";
            label.className = "tab-label text-[10px] font-medium text-[#5C586B] group-hover:text-[#111A1C]";
          }
        });
      } else {
        subHeader.classList.remove('hidden');
        subTitle.innerText = getScreenDisplayTitle(currentScreen);
        bottomNav.classList.remove('hidden');
      }

      document.getElementById('screenViewport').scrollTop = 0;
    }

    function getScreenDisplayTitle(screen) {
      switch (screen) {
        case 'planning': return 'Daily Planning';
        case 'habits': return 'All Habits Manager';
        case 'review': return 'Daily Review';
        case 'settings': return 'Settings & Data';
        default: return screen.toUpperCase();
      }
    }

    // Item Toggling Operations
    function toggleHabit(id) {
      const h = habits.find(x => x.id === id);
      if (h) {
        h.completed = !h.completed;
        saveState();
        renderCurrentScreen();
        showToast(h.completed ? `Done: ${h.name}` : `Unchecked: ${h.name}`);
      }
    }

    function toggleTask(id) {
      const t = tasks.find(x => x.id === id);
      if (t) {
        t.completed = !t.completed;
        saveState();
        renderCurrentScreen();
        showToast(t.completed ? `Completed: ${t.title}` : `Reopened: ${t.title}`);
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(x => x.id !== id);
      saveState();
      renderCurrentScreen();
      showToast('Task deleted');
    }

    function deleteHabit(id) {
      habits = habits.filter(x => x.id !== id);
      saveState();
      renderCurrentScreen();
      showToast('Habit deleted');
    }

    // Modal Operations (Add / Edit)
    function openModal(type) {
      const overlay = document.getElementById('modalOverlay');
      const card = document.getElementById('modalCard');

      if (type === 'task') {
        card.innerHTML = `
          <div class="flex justify-between items-center pb-2 border-b border-[#E2DEED]">
            <h3 class="text-sm font-bold text-[#111A1C]">+ Add New Task</h3>
            <button onclick="closeModal()" class="text-[#5C586B] hover:text-[#111A1C] font-bold text-lg">&times;</button>
          </div>
          <div class="space-y-3 pt-1">
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Task Title</label>
              <input id="newInputTitle" type="text" placeholder="e.g. Finish quarterly presentation" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8]" />
            </div>
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Life Area</label>
              <select id="newInputArea" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8] bg-white">
                <option value="Career">Career & Productivity</option>
                <option value="Health">Health & Lifestyle</option>
                <option value="Finance">Finance & Wealth</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Category</label>
              <select id="newInputCategory" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8] bg-white">
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Personal">Personal</option>
              </select>
            </div>
            <button onclick="submitNewTask()" class="w-full py-2.5 bg-[#111A1C] text-white rounded-full text-xs font-bold shadow-md hover:bg-black transition-colors">
              Save Task
            </button>
          </div>
        `;
      } else if (type === 'habit') {
        card.innerHTML = `
          <div class="flex justify-between items-center pb-2 border-b border-[#E2DEED]">
            <h3 class="text-sm font-bold text-[#111A1C]">+ Add New Habit</h3>
            <button onclick="closeModal()" class="text-[#5C586B] hover:text-[#111A1C] font-bold text-lg">&times;</button>
          </div>
          <div class="space-y-3 pt-1">
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Habit Name</label>
              <input id="newInputTitle" type="text" placeholder="e.g. 10 minutes meditation" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8]" />
            </div>
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Life Area</label>
              <select id="newInputArea" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8] bg-white">
                <option value="Health">Health & Lifestyle</option>
                <option value="Career">Career & Productivity</option>
                <option value="Finance">Finance & Wealth</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Schedule Frequency</label>
              <select id="newInputSchedule" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8] bg-white">
                <option value="Every day">Every day</option>
                <option value="Weekdays">Weekdays (Mon-Fri)</option>
                <option value="Weekends">Weekends (Sat-Sun)</option>
              </select>
            </div>
            <button onclick="submitNewHabit()" class="w-full py-2.5 bg-[#111A1C] text-white rounded-full text-xs font-bold shadow-md hover:bg-black transition-colors">
              Save Habit
            </button>
          </div>
        `;
      } else if (type === 'expense') {
        card.innerHTML = `
          <div class="flex justify-between items-center pb-2 border-b border-[#E2DEED]">
            <h3 class="text-sm font-bold text-[#111A1C]">+ Add Transaction</h3>
            <button onclick="closeModal()" class="text-[#5C586B] hover:text-[#111A1C] font-bold text-lg">&times;</button>
          </div>
          <div class="space-y-3 pt-1">
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Transaction Description</label>
              <input id="newInputTitle" type="text" placeholder="e.g. Grocery store, Consulting fee" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8]" />
            </div>
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Amount (₹)</label>
              <input id="newInputAmount" type="number" placeholder="1500" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8]" />
            </div>
            <div>
              <label class="text-[11px] font-semibold text-[#5C586B] block mb-1">Transaction Type</label>
              <select id="newInputType" class="w-full text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8] bg-white">
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
              </select>
            </div>
            <button onclick="submitNewExpense()" class="w-full py-2.5 bg-[#111A1C] text-white rounded-full text-xs font-bold shadow-md hover:bg-black transition-colors">
              Save Transaction
            </button>
          </div>
        `;
      }

      overlay.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    function submitNewTask() {
      const title = document.getElementById('newInputTitle').value.trim();
      const area = document.getElementById('newInputArea').value;
      const cat = document.getElementById('newInputCategory').value;
      if (!title) return;
      tasks.unshift({
        id: 't_' + Date.now(),
        title: title,
        area: area,
        category: cat,
        time: '09:00 AM',
        completed: false
      });
      saveState();
      closeModal();
      renderCurrentScreen();
      showToast('Task added successfully');
    }

    function submitNewHabit() {
      const title = document.getElementById('newInputTitle').value.trim();
      const area = document.getElementById('newInputArea').value;
      const sched = document.getElementById('newInputSchedule').value;
      if (!title) return;
      habits.unshift({
        id: 'h_' + Date.now(),
        name: title,
        area: area,
        schedule: sched,
        frequency: sched,
        completed: false
      });
      saveState();
      closeModal();
      renderCurrentScreen();
      showToast('Habit added successfully');
    }

    function submitNewExpense() {
      const title = document.getElementById('newInputTitle').value.trim();
      const amt = parseFloat(document.getElementById('newInputAmount').value);
      const type = document.getElementById('newInputType').value;
      if (!title || isNaN(amt)) return;
      expenses.unshift({
        id: 'e_' + Date.now(),
        title: title,
        amount: amt,
        category: type === 'Income' ? 'Income' : 'General',
        type: type,
        date: 'Today'
      });
      saveState();
      closeModal();

    // Canvas drawing matching exactly LaYear365Calendar from Charts.kt
    function drawYearHeatmap() {
      const canvas = document.getElementById('heatmapCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;

      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = 270 * dpr;
      ctx.scale(dpr, dpr);

      const columns = 20;
      const totalDays = 365;
      const rows = Math.ceil(totalDays / columns); // 19 rows
      const colW = rect.width / columns;
      const rowH = 270 / rows;
      const cellSize = Math.min(colW, rowH) * 0.76;
      const corner = cellSize * 0.34;

      const elapsedDays = 324; // Up to Nov 20, 2026
      // October 2026 is day 274 to 304 (31 days). In October 30 days are scored!
      const scoredDaysMap = {};
      for (let d = 274; d <= 304; d++) {
        if (d !== 284) { // 1 day no data (Oct 11)
          const dayOfOct = d - 273;
          let level = 1;
          if (dayOfOct % 3 === 0) level = 4; // ink
          else if (dayOfOct % 2 === 0) level = 3; // strong
          else level = 2; // base
          scoredDaysMap[d] = level;
        }
      }

      ctx.clearRect(0, 0, rect.width, 270);

      for (let idx = 0; idx < totalDays; idx++) {
        const row = Math.floor(idx / columns);
        const col = idx % columns;
        const cx = col * colW + colW / 2;
        const cy = row * rowH + rowH / 2;
        const x = cx - cellSize / 2;
        const y = cy - cellSize / 2;

        if (idx < elapsedDays) {
          if (scoredDaysMap[idx]) {
            // ELAPSED_SCORED
            const lvl = scoredDaysMap[idx];
            let fill = '#EFEAFC';
            if (lvl === 2) fill = '#DDD0F7';
            else if (lvl === 3) fill = '#D3C1F3';
            else if (lvl === 4) fill = '#111A1C';

            ctx.fillStyle = fill;
            roundRect(ctx, x, y, cellSize, cellSize, corner);
            ctx.fill();
          } else {
            // ELAPSED_NO_DATA (Outlined rounded square + center dot)
            ctx.strokeStyle = 'rgba(92, 88, 107, 0.45)';
            ctx.lineWidth = 1.25;
            roundRect(ctx, x, y, cellSize, cellSize, corner);
            ctx.stroke();

            ctx.fillStyle = 'rgba(92, 88, 107, 0.45)';
            ctx.beginPath();
            ctx.arc(cx, cy, cellSize * 0.15, 0, Math.PI * 2);
            ctx.fill();
          }
        } else {
          // FUTURE (Subtle outline circle)
          ctx.fillStyle = 'rgba(226, 222, 237, 0.65)';
          ctx.beginPath();
          ctx.arc(cx, cy, cellSize * 0.22, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

                    <span class="text-xs ${h.completed ? 'text-[#5C586B] line-through' : 'text-[#111A1C] font-semibold'} truncate">${h.name}</span>
                  </div>
                  <span class="text-[10px] text-[#7563D8] bg-[#DDD0F7] px-2.5 py-0.5 rounded-full font-bold">Due today</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 3: Career & Productivity Screen
    // ==========================================
    function renderCareerScreen(vp) {
      const careerHabits = habits.filter(h => h.area === 'Career');
      const careerTasks = tasks.filter(t => t.area === 'Career');
      const doneTasks = careerTasks.filter(t => t.completed).length;
      const doneHabits = careerHabits.filter(h => h.completed).length;
      const taskPct = careerTasks.length > 0 ? Math.round((doneTasks / careerTasks.length) * 100) : 0;
      const habitPct = careerHabits.length > 0 ? Math.round((doneHabits / careerHabits.length) * 100) : 0;
      const combinedScore = Math.round(0.6 * taskPct + 0.4 * habitPct);

      vp.innerHTML = `
        <div class="px-5 pt-3 space-y-3">
          <div>
            <h1 class="text-xl font-bold text-[#111A1C]">Career & Productivity</h1>
            <p class="text-[12px] text-[#5C586B]">Tasks, learning habits, skill-building, and focus.</p>
          </div>

          <!-- Career Hero Panel (Strong Lavender #D3C1F3) -->
          <div class="bg-[#D3C1F3] rounded-[32px] p-5 shadow-xs">
            <div class="flex justify-between items-center mb-2">
              <div>
                <p class="text-xs font-semibold text-[#3E3A52]">Career Performance</p>
                <h2 class="text-3xl font-extrabold text-[#111A1C] mt-1">${combinedScore} / 100</h2>
              </div>
              <div class="w-10 h-10 rounded-full bg-white/60 flex items-center justify-center text-[#7563D8]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              </div>
            </div>
            <p class="text-xs text-[#3E3A52] font-semibold">60% Tasks (${doneTasks}/${careerTasks.length}) · 40% Learning Habits (${doneHabits}/${careerHabits.length})</p>
          </div>

          <!-- Actions -->
          <div class="grid grid-cols-2 gap-2">
            <button onclick="openModal('task')" class="py-3 px-3 bg-[#FFFFFF] rounded-full border border-[#E2DEED] text-xs font-bold text-[#111A1C] flex items-center justify-center gap-1.5 shadow-xs">
              <span class="text-[#7563D8] text-sm">+</span> Add task
            </button>
            <button onclick="openModal('habit')" class="py-3 px-3 bg-[#FFFFFF] rounded-full border border-[#E2DEED] text-xs font-bold text-[#111A1C] flex items-center justify-center gap-1.5 shadow-xs">
              <span class="text-[#7563D8] text-sm">+</span> Add habit
            </button>
          </div>

          <!-- Career Tasks -->
          <div class="bg-[#FFFFFF] rounded-[24px] p-5 shadow-xs border border-[#E2DEED]/70">
            <div class="flex justify-between items-center mb-2">
              <h3 class="text-base font-bold text-[#111A1C]">Today's career tasks</h3>
              <button onclick="navigateTo('planning')" class="text-xs font-bold text-[#7563D8]">Plan day</button>
            </div>
            <div class="space-y-2">
              ${careerTasks.map(t => `
                <div onclick="toggleTask('${t.id}')" class="flex items-center justify-between p-3 rounded-2xl bg-[#F4F3F9] border border-[#E2DEED]/50 cursor-pointer">
                  <div class="flex items-center gap-2.5 flex-1 min-w-0">
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${t.id}')" class="w-4 h-4 rounded text-[#7563D8] accent-[#7563D8]">
                    <span class="text-xs ${t.completed ? 'text-[#5C586B] line-through' : 'text-[#111A1C] font-semibold'} truncate">${t.title}</span>
                  </div>
                  <span class="text-[10px] font-semibold text-[#5C586B] bg-[#FFFFFF] px-2 py-0.5 rounded-md ml-2 shrink-0 border border-[#E2DEED]/50">${t.category}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 4: Finance & Wealth Screen
    // ==========================================
    function renderFinanceScreen(vp) {
      const totalExpense = expenses.filter(e => e.type === 'Expense').reduce((acc, curr) => acc + curr.amount, 0);
      const totalIncome = expenses.filter(e => e.type === 'Income').reduce((acc, curr) => acc + curr.amount, 0);
      const netCash = totalIncome - totalExpense;
      const budgetAdherence = Math.max(0, Math.round(((monthlyBudget - totalExpense) / monthlyBudget) * 100));

      vp.innerHTML = `
        <div class="px-5 pt-3 space-y-3">
          <div>
            <h1 class="text-xl font-bold text-[#111A1C]">Finance & Wealth</h1>
            <p class="text-[12px] text-[#5C586B]">Expenses, cash flow, budget adherence, and savings.</p>
          </div>

          <!-- Finance Hero Panel (Strong Lavender #D3C1F3) -->
          <div class="bg-[#D3C1F3] rounded-[32px] p-5 shadow-xs">
            <p class="text-xs font-semibold text-[#3E3A52]">Net Cash Flow (Monthly)</p>
            <h2 class="text-3xl font-extrabold text-[#111A1C] mt-1">+₹${netCash.toLocaleString()}</h2>
            <div class="flex justify-between items-center mt-3 pt-3 border-t border-[#3E3A52]/20 text-xs font-semibold text-[#3E3A52]">
              <span>Income: ₹${totalIncome.toLocaleString()}</span>
              <span>Spent: ₹${totalExpense.toLocaleString()}</span>
            </div>
          </div>

          <!-- Budget Card -->
          <div class="bg-[#FFFFFF] rounded-[24px] p-5 shadow-xs border border-[#E2DEED]/70 space-y-2">
            <div class="flex justify-between items-center">
              <div>
                <h4 class="text-xs font-bold text-[#111A1C]">Monthly Budget (₹${monthlyBudget.toLocaleString()})</h4>
                <p class="text-[11px] text-[#5C586B]">Spent ₹${totalExpense.toLocaleString()} of target</p>
              </div>
              <span class="text-xs font-bold ${budgetAdherence > 50 ? 'text-emerald-700' : 'text-amber-700'}">${budgetAdherence}% Left</span>
            </div>
            <div class="w-full bg-[#EFEDF6] h-2.5 rounded-full overflow-hidden">
              <div class="bg-[#7563D8] h-full rounded-full" style="width: ${Math.min(100, Math.round((totalExpense / monthlyBudget) * 100))}%"></div>
            </div>
          </div>

          <!-- Action -->
          <button onclick="openModal('expense')" class="w-full py-3 bg-[#FFFFFF] rounded-full border border-[#E2DEED] text-xs font-bold text-[#111A1C] flex items-center justify-center gap-1.5 shadow-xs">
            <span class="text-[#7563D8] text-sm">+</span> Add transaction
          </button>

          <!-- Transactions List -->
          <div class="bg-[#FFFFFF] rounded-[24px] p-5 shadow-xs border border-[#E2DEED]/70">
            <h3 class="text-base font-bold text-[#111A1C] mb-2">Recent Transactions</h3>
            <div class="divide-y divide-[#E2DEED]/60">
              ${expenses.map(e => `
                <div class="py-2.5 flex justify-between items-center">
                  <div>
                    <h4 class="text-xs font-bold text-[#111A1C]">${e.title}</h4>
                    <span class="text-[10px] text-[#5C586B] font-medium">${e.category} · ${e.date || 'Today'}</span>
                  </div>
                  <span class="text-xs font-bold ${e.type === 'Income' ? 'text-emerald-700' : 'text-[#111A1C]'}">
                    ${e.type === 'Income' ? '+' : '-'}₹${e.amount.toLocaleString()}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 5: Daily Planning Screen
    // ==========================================
    function renderPlanningScreen(vp) {
      vp.innerHTML = `
        <div class="px-5 pt-3 space-y-3">
          <div>
            <h1 class="text-xl font-bold text-[#111A1C]">Daily Planning</h1>
            <p class="text-[12px] text-[#5C586B]">Plan and schedule tasks for today.</p>
          </div>

          <div class="bg-[#FFFFFF] rounded-[24px] p-5 border border-[#E2DEED] shadow-xs flex justify-between items-center">
            <div>
              <span class="text-xs text-[#5C586B] font-medium">Total Planned</span>
              <h3 class="text-lg font-extrabold text-[#111A1C]">${tasks.length} Tasks</h3>
            </div>
            <div>
              <span class="text-xs text-[#5C586B] font-medium">Completed</span>
              <h3 class="text-lg font-extrabold text-[#7563D8]">${tasks.filter(t => t.completed).length} Done</h3>
            </div>
            <button onclick="openModal('task')" class="px-3.5 py-2 bg-[#111A1C] text-white rounded-full text-xs font-bold shadow-xs">
              + New
            </button>
          </div>

          <div class="bg-[#FFFFFF] rounded-[24px] p-5 border border-[#E2DEED] shadow-xs space-y-2.5">
            <h3 class="text-xs font-bold text-[#111A1C]">Planned Tasks</h3>
            ${tasks.length === 0 ? `
              <p class="text-xs text-[#5C586B] py-3 text-center">No tasks planned. Tap '+ New' to add a task.</p>
            ` : tasks.map(t => `
              <div class="flex items-center justify-between p-3 rounded-2xl bg-[#F4F3F9] border border-[#E2DEED]/50">
                <div class="flex items-center gap-3 flex-1 min-w-0" onclick="toggleTask('${t.id}')">
                  <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${t.id}')" class="w-4 h-4 rounded text-[#7563D8] accent-[#7563D8]">
                  <div class="min-w-0">
                    <h4 class="text-xs ${t.completed ? 'text-[#5C586B] line-through' : 'text-[#111A1C] font-semibold'} truncate">${t.title}</h4>
                    <span class="text-[10px] text-[#5C586B]">${t.area} · ${t.category}</span>
                  </div>
                </div>
                <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-rose-500 text-xs px-2 py-1">✕</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 6: All Habits Manager Screen
    // ==========================================
    function renderAllHabitsScreen(vp) {
      vp.innerHTML = `
        <div class="px-5 pt-3 space-y-3">
          <div>
            <h1 class="text-xl font-bold text-[#111A1C]">Habits Manager</h1>
            <p class="text-[12px] text-[#5C586B]">Configure schedules and recurring routines.</p>
          </div>

          <button onclick="openModal('habit')" class="w-full py-3 bg-[#111A1C] text-white rounded-full text-xs font-bold shadow-md hover:bg-black transition-colors">
            + Add New Habit
          </button>

          <div class="bg-[#FFFFFF] rounded-[24px] p-5 border border-[#E2DEED] shadow-xs divide-y divide-[#E2DEED]/60">
            ${habits.map(h => `
              <div class="py-3 flex items-center justify-between">
                <div>
                  <h4 class="text-xs font-bold text-[#111A1C]">${h.name}</h4>
                  <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[10px] text-[#5C586B] font-medium">${h.schedule || 'Daily'}</span>
                    <span class="text-[9px] px-2 py-0.5 bg-[#DDD0F7] text-[#7563D8] rounded-full font-bold">${h.area}</span>
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button onclick="toggleHabit('${h.id}')" class="text-xs px-2.5 py-1 rounded-full ${h.completed ? 'bg-emerald-100 text-emerald-800 font-bold' : 'bg-[#EFEDF6] text-[#5C586B]'}">
                    ${h.completed ? 'Done' : 'Pending'}
                  </button>
                  <button onclick="deleteHabit('${h.id}')" class="text-slate-300 hover:text-rose-500 text-xs px-1">✕</button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 7: Daily Review Screen
    // ==========================================
    function renderReviewScreen(vp) {
      vp.innerHTML = `
        <div class="px-5 pt-3 space-y-3">
          <div>
            <h1 class="text-xl font-bold text-[#111A1C]">Daily Review</h1>
            <p class="text-[12px] text-[#5C586B]">Reflect on your achievements and daily progress.</p>
          </div>

          <div class="bg-[#FFFFFF] rounded-[24px] p-5 border border-[#E2DEED] shadow-xs space-y-2">
            <label class="text-xs font-bold text-[#111A1C]">How was your day?</label>
            <div class="grid grid-cols-4 gap-2 pt-1">
              ${['Great', 'Good', 'Okay', 'Tough'].map(m => `
                <button onclick="dailyMood='${m}'; saveState(); renderCurrentScreen(); showToast('Mood saved: ${m}')" class="py-2.5 rounded-2xl text-xs font-bold border transition-all ${dailyMood === m ? 'bg-[#7563D8] text-white border-[#7563D8] shadow-xs' : 'bg-[#EFEDF6] text-[#111A1C] border-[#E2DEED] hover:bg-slate-100'}">
                  ${m === 'Great' ? '🌟 ' : m === 'Good' ? '😊 ' : m === 'Okay' ? '😐 ' : '🌧️ '}${m}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="bg-[#FFFFFF] rounded-[24px] p-5 border border-[#E2DEED] shadow-xs space-y-2">
            <label class="text-xs font-bold text-[#111A1C]">Daily Reflection Notes</label>
            <textarea id="reviewTextarea" rows="4" class="w-full text-xs p-3 rounded-2xl border border-[#E2DEED] focus:outline-[#7563D8] resize-none" placeholder="What went well today? What can improve?">${dailyReviewNotes}</textarea>
            <button onclick="dailyReviewNotes=document.getElementById('reviewTextarea').value; saveState(); showToast('Review notes saved!')" class="w-full py-2.5 bg-[#111A1C] text-white rounded-full text-xs font-bold shadow-xs">
              Save Review
            </button>
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 8: Settings Screen
    // ==========================================
    function renderSettingsScreen(vp) {
      vp.innerHTML = `
        <div class="px-5 pt-3 space-y-3">
          <div>
            <h1 class="text-xl font-bold text-[#111A1C]">Settings</h1>
            <p class="text-[12px] text-[#5C586B]">Preferences, targets, and data management.</p>
          </div>

          <div class="bg-[#FFFFFF] rounded-[24px] p-5 border border-[#E2DEED] shadow-xs space-y-3">
            <h3 class="text-xs font-bold text-[#111A1C]">Finance Budget Target</h3>
            <div>
              <label class="text-[11px] text-[#5C586B] block mb-1">Monthly Budget Limit (₹)</label>
              <div class="flex gap-2">
                <input id="budgetInput" type="number" value="${monthlyBudget}" class="flex-1 text-xs p-2.5 rounded-xl border border-[#E2DEED] focus:outline-[#7563D8]" />
                <button onclick="monthlyBudget=parseInt(document.getElementById('budgetInput').value)||45000; saveState(); showToast('Budget updated!'); renderCurrentScreen();" class="px-4 py-2 bg-[#7563D8] text-white rounded-xl text-xs font-bold">Save</button>
              </div>
            </div>
          </div>

          <div class="bg-[#FFFFFF] rounded-[24px] p-5 border border-[#E2DEED] shadow-xs space-y-2">
            <h3 class="text-xs font-bold text-[#111A1C]">Demo Sample Dataset</h3>
            <p class="text-[11px] text-[#5C586B]">Reset mock demo data anytime to start clean.</p>
            <button onclick="resetPrototypeData()" class="w-full py-2.5 bg-[#EFEDF6] hover:bg-[#E2DEED] text-[#111A1C] rounded-xl text-xs font-bold transition-colors">
              Reset Sample Month
            </button>
          </div>
        </div>
      `;
    }

    // Initialize View
    renderCurrentScreen();
  </script>
</body>
</html>
