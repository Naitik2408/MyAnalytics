<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Analytics — Full Web Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col items-center justify-center p-2 sm:p-6 selection:bg-[#5C45EE] selection:text-white">

  <!-- Desktop Top Control Bar -->
  <header class="w-full max-w-4xl mb-4 flex flex-wrap items-center justify-between gap-3 px-4 py-2.5 bg-slate-800/80 backdrop-blur-md rounded-2xl border border-slate-700/60 text-white shadow-lg">
    <div class="flex items-center gap-2.5">
      <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-xs sm:text-sm font-bold tracking-tight">Life Analytics — Full App Web Clone</span>
      <span class="text-[10px] bg-[#5C45EE] text-white px-2 py-0.5 rounded-full font-semibold">All 8 Screens Active</span>
    </div>

    <!-- Quick Navigation Shortcuts on Desktop -->
    <div class="flex items-center gap-1.5 text-xs">
      <button onclick="navigateTo('home')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Home</button>
      <button onclick="navigateTo('health')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Health</button>
      <button onclick="navigateTo('career')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Career</button>
      <button onclick="navigateTo('finance')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Finance</button>
      <button onclick="navigateTo('planning')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Planning</button>
      <button onclick="navigateTo('habits')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Habits</button>
      <button onclick="navigateTo('review')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Review</button>
      <button onclick="navigateTo('settings')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">Settings</button>
      <button onclick="resetPrototypeData()" class="ml-2 px-2.5 py-1 bg-rose-900/60 hover:bg-rose-800 text-rose-200 rounded font-medium">Reset Data</button>
    </div>
  </header>

  <!-- Mobile Device Shell / Wrapper -->
  <div id="deviceContainer" class="w-[390px] h-[844px] bg-[#F7F6FD] rounded-[44px] shadow-2xl border-[8px] border-slate-800 flex flex-col overflow-hidden relative transition-all duration-300">
    
    <!-- Status Bar -->
    <div class="pt-3 px-7 flex justify-between items-center text-xs font-semibold text-slate-800 select-none bg-[#F7F6FD] z-10">
      <span>23:41</span>
      <!-- Dynamic Island pill -->
      <div class="w-24 h-5 bg-black rounded-full flex items-center justify-center">
        <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
      </div>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A10.97 10.97 0 0 1 1 12C1 5.92 1 12 1s11 4.92 11 11c0 2.45-.8 4.71-2.16 6.54l-.62-.62A9.97 9.97 0 0 0 21 12c0-4.97-4.03-9-9-9z"/><path d="M12 7c-2.76 0-5 2.24-5 5 0 1.25.46 2.4 1.22 3.28l.71-.71A3.96 3.96 0 0 1 8 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .93-.32 1.79-.86 2.47l.71.71A4.96 4.96 0 0 0 17 12c0-2.76-2.24-5-5-5z"/></svg>
        <span class="text-[10px] bg-slate-200 px-1 rounded font-bold">5G</span>
        <div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3/4 bg-slate-800 rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- Top App Bar with back navigation when not on a primary bottom tab -->
    <div id="subScreenHeader" class="hidden px-4 py-2 bg-[#F7F6FD] border-b border-slate-200/60 flex items-center justify-between z-10">
      <button onclick="navigateBack()" class="flex items-center gap-1.5 text-xs font-bold text-slate-700 hover:text-[#5C45EE]">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
        <span>Back</span>
      </button>
      <span id="subScreenTitle" class="text-xs font-bold text-slate-900">Screen</span>
      <div class="w-8"></div>
    </div>

    <!-- Active Screen Viewport (Scrollable) -->
    <div id="screenViewport" class="flex-1 overflow-y-auto custom-scroll px-4 pt-3 pb-24 space-y-3.5">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Bottom Navigation Bar (4 Pillars: Home, Health, Career, Finance) -->
    <nav id="bottomNavBar" class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-6 py-2.5 flex justify-between items-center z-20 shadow-lg">
      
      <!-- Home Tab -->
      <button onclick="navigateTo('home')" id="tab-home" class="tab-btn flex flex-col items-center gap-0.5 group">
        <div class="tab-icon w-12 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center transition-all">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <span class="tab-label text-[10px] font-bold text-slate-900">Home</span>
      </button>

      <!-- Health Tab -->
      <button onclick="navigateTo('health')" id="tab-health" class="tab-btn flex flex-col items-center gap-0.5 group">
        <div class="tab-icon w-10 h-7 flex items-center justify-center text-slate-400 group-hover:text-slate-700 transition-all">
          <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
        </div>
        <span class="tab-label text-[10px] font-medium text-slate-400 group-hover:text-slate-700">Health</span>
      </button>

      <!-- Career Tab -->
      <button onclick="navigateTo('career')" id="tab-career" class="tab-btn flex flex-col items-center gap-0.5 group">
        <div class="tab-icon w-10 h-7 flex items-center justify-center text-slate-400 group-hover:text-slate-700 transition-all">
          <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        </div>
        <span class="tab-label text-[10px] font-medium text-slate-400 group-hover:text-slate-700">Career</span>
      </button>

      <!-- Finance Tab -->
      <button onclick="navigateTo('finance')" id="tab-finance" class="tab-btn flex flex-col items-center gap-0.5 group">
        <div class="tab-icon w-10 h-7 flex items-center justify-center text-slate-400 group-hover:text-slate-700 transition-all">
          <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        </div>
        <span class="tab-label text-[10px] font-medium text-slate-400 group-hover:text-slate-700">Finance</span>
      </button>

    </nav>

    <!-- Modal Dialog (Add task / Add habit / Add expense / Edit) -->
    <div id="modalOverlay" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-xs z-30 flex items-end justify-center transition-all">
      <div id="modalCard" class="w-full bg-white rounded-t-3xl p-5 shadow-2xl border-t border-slate-100 max-h-[85%] overflow-y-auto space-y-4">
        <!-- Injected via openModal() -->
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden absolute top-14 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-full shadow-lg z-40 flex items-center gap-2">
      <span id="toastMsg">Action completed</span>
    </div>

  </div>

  <!-- Client-side Interactive Application Logic -->
  <script>
    // Navigation Stack
    const navStack = ['home'];
    let currentScreen = 'home';

    // Core Data Models
    const initialHabits = [
      { id: 'h1', name: '2L Water', area: 'Health', schedule: 'Every day', frequency: 'Daily', completed: true },
      { id: 'h2', name: '5k steps', area: 'Health', schedule: 'Mon, Tue, Wed, Thu, Fri', frequency: 'Weekdays', completed: true },
      { id: 'h3', name: 'Morning Cold Shower', area: 'Health', schedule: 'Every day', frequency: 'Daily', completed: false },
      { id: 'h4', name: 'Min 7 hours sleep', area: 'Health', schedule: 'Every day', frequency: 'Daily', completed: false },
      { id: 'h5', name: 'Read 20 mins', area: 'Career', schedule: 'Every day', frequency: 'Daily', completed: true },
      { id: 'h6', name: 'English speaking practice', area: 'Career', schedule: 'Mon-Fri', frequency: 'Weekdays', completed: false },
      { id: 'h7', name: 'Weekly budget review', area: 'Finance', schedule: 'Sundays', frequency: 'Weekly', completed: false },
    ];

    const initialTasks = [
      { id: 't1', title: 'Complete project architecture document', area: 'Career', category: 'Work', time: '10:00 AM', completed: true },
      { id: 't2', title: 'Review monthly savings and expenses', area: 'Finance', category: 'Personal', time: '02:30 PM', completed: false },
      { id: 't3', title: 'Practice 2 algorithm design problems', area: 'Career', category: 'Study', time: '04:00 PM', completed: false },
      { id: 't4', title: '30-minute cardio and mobility routine', area: 'Health', category: 'Personal', time: '06:00 PM', completed: false },
    ];

    const initialExpenses = [
      { id: 'e1', title: 'Organic Market & Groceries', amount: 3200, category: 'Food & Dining', type: 'Expense', date: '19 Nov 2026' },
      { id: 'e2', title: 'Gym & Fitness Membership', amount: 2500, category: 'Health', type: 'Expense', date: '18 Nov 2026' },
      { id: 'e3', title: 'High-speed Fiber Broadband', amount: 1499, category: 'Utilities', type: 'Expense', date: '16 Nov 2026' },
      { id: 'e4', title: 'Client Consulting Retainer', amount: 85000, category: 'Income', type: 'Income', date: '01 Nov 2026' },
    ];

    let habits = JSON.parse(localStorage.getItem('la_habits')) || initialHabits;
    let tasks = JSON.parse(localStorage.getItem('la_tasks')) || initialTasks;
    let expenses = JSON.parse(localStorage.getItem('la_expenses')) || initialExpenses;
    let dailyReviewNotes = localStorage.getItem('la_daily_review') || "Productive day! Kept up with hydration and finished the system architecture docs.";
    let dailyMood = localStorage.getItem('la_daily_mood') || "Great";
    let monthlyBudget = parseInt(localStorage.getItem('la_monthly_budget')) || 45000;

    function saveState() {
      localStorage.setItem('la_habits', JSON.stringify(habits));
      localStorage.setItem('la_tasks', JSON.stringify(tasks));
      localStorage.setItem('la_expenses', JSON.stringify(expenses));
      localStorage.setItem('la_daily_review', dailyReviewNotes);
      localStorage.setItem('la_daily_mood', dailyMood);
      localStorage.setItem('la_monthly_budget', monthlyBudget);
    }

    function resetPrototypeData() {
      habits = JSON.parse(JSON.stringify(initialHabits));
      tasks = JSON.parse(JSON.stringify(initialTasks));
      expenses = JSON.parse(JSON.stringify(initialExpenses));
      dailyReviewNotes = "Productive day! Kept up with hydration and finished the system architecture docs.";
      dailyMood = "Great";
      monthlyBudget = 45000;
      saveState();
      renderCurrentScreen();
      showToast('All sample data reset to default');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2000);
    }

    // Navigation Logic
    const primaryPillars = ['home', 'health', 'career', 'finance'];

    function navigateTo(screen) {
      if (currentScreen === screen) return;
      navStack.push(screen);
      currentScreen = screen;
      updateNavigationUI();
      renderCurrentScreen();
    }

    function navigateBack() {
      if (navStack.length > 1) {
        navStack.pop();
        currentScreen = navStack[navStack.length - 1];
        updateNavigationUI();
        renderCurrentScreen();
      } else {
        navigateTo('home');
      }
    }

    function updateNavigationUI() {
      const isPrimary = primaryPillars.includes(currentScreen);
      const subHeader = document.getElementById('subScreenHeader');
      const subTitle = document.getElementById('subScreenTitle');
      const bottomNav = document.getElementById('bottomNavBar');

      if (isPrimary) {
        subHeader.classList.add('hidden');
        bottomNav.classList.remove('hidden');

        // Update Bottom Bar Tabs
        primaryPillars.forEach(p => {
          const btn = document.getElementById(`tab-${p}`);
          const iconDiv = btn.querySelector('.tab-icon');
          const label = btn.querySelector('.tab-label');

          if (p === currentScreen) {
            iconDiv.className = "tab-icon w-12 h-7 rounded-full bg-slate-900 text-white flex items-center justify-center transition-all shadow-xs";
            label.className = "tab-label text-[10px] font-bold text-slate-900";
          } else {
            iconDiv.className = "tab-icon w-10 h-7 flex items-center justify-center text-slate-400 group-hover:text-slate-700 transition-all";
            label.className = "tab-label text-[10px] font-medium text-slate-400 group-hover:text-slate-700";
          }
        });
      } else {
        subHeader.classList.remove('hidden');
        subTitle.innerText = getScreenDisplayTitle(currentScreen);
        bottomNav.classList.remove('hidden');
      }

      // Scroll viewport back to top on navigation
      document.getElementById('screenViewport').scrollTop = 0;
    }

    function getScreenDisplayTitle(screen) {
      switch (screen) {
        case 'planning': return 'Daily Planning';
        case 'habits': return 'All Habits Manager';
        case 'review': return 'Daily Review';
        case 'settings': return 'Settings & Data';
        default: return screen.toUpperCase();
      }
    }

    // Item Toggling Operations
    function toggleHabit(id) {
      const h = habits.find(x => x.id === id);
      if (h) {
        h.completed = !h.completed;
        saveState();
        renderCurrentScreen();
        showToast(h.completed ? `Done: ${h.name}` : `Unchecked: ${h.name}`);
      }
    }

    function toggleTask(id) {
      const t = tasks.find(x => x.id === id);
      if (t) {
        t.completed = !t.completed;
        saveState();
        renderCurrentScreen();
        showToast(t.completed ? `Completed: ${t.title}` : `Reopened: ${t.title}`);
      }
    }

    function deleteTask(id) {
      tasks = tasks.filter(x => x.id !== id);
      saveState();
      renderCurrentScreen();
      showToast('Task deleted');
    }

    function deleteHabit(id) {
      habits = habits.filter(x => x.id !== id);
      saveState();
      renderCurrentScreen();
      showToast('Habit deleted');
    }

    // Modal Operations (Add / Edit)
    function openModal(type) {
      const overlay = document.getElementById('modalOverlay');
      const card = document.getElementById('modalCard');

      if (type === 'task') {
        card.innerHTML = `
          <div class="flex justify-between items-center pb-2 border-b border-slate-100">
            <h3 class="text-sm font-bold text-slate-900">+ Add New Task</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">&times;</button>
          </div>
          <div class="space-y-3 pt-1">
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Task Title</label>
              <input id="newInputTitle" type="text" placeholder="e.g. Finish quarterly presentation" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE]" />
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Life Area</label>
              <select id="newInputArea" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE] bg-white">
                <option value="Career">Career & Productivity</option>
                <option value="Health">Health & Lifestyle</option>
                <option value="Finance">Finance & Wealth</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Category</label>
              <select id="newInputCategory" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE] bg-white">
                <option value="Work">Work</option>
                <option value="Study">Study</option>
                <option value="Personal">Personal</option>
              </select>
            </div>
            <button onclick="submitNewTask()" class="w-full py-2.5 bg-[#5C45EE] text-white rounded-full text-xs font-bold shadow-md hover:bg-[#4d36db] transition-colors">
              Save Task
            </button>
          </div>
        `;
      } else if (type === 'habit') {
        card.innerHTML = `
          <div class="flex justify-between items-center pb-2 border-b border-slate-100">
            <h3 class="text-sm font-bold text-slate-900">+ Add New Habit</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">&times;</button>
          </div>
          <div class="space-y-3 pt-1">
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Habit Name</label>
              <input id="newInputTitle" type="text" placeholder="e.g. 10 minutes meditation" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE]" />
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Life Area</label>
              <select id="newInputArea" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE] bg-white">
                <option value="Health">Health & Lifestyle</option>
                <option value="Career">Career & Productivity</option>
                <option value="Finance">Finance & Wealth</option>
              </select>
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Schedule Frequency</label>
              <select id="newInputSchedule" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE] bg-white">
                <option value="Every day">Every day</option>
                <option value="Weekdays">Weekdays (Mon-Fri)</option>
                <option value="Weekends">Weekends (Sat-Sun)</option>
              </select>
            </div>
            <button onclick="submitNewHabit()" class="w-full py-2.5 bg-[#5C45EE] text-white rounded-full text-xs font-bold shadow-md hover:bg-[#4d36db] transition-colors">
              Save Habit
            </button>
          </div>
        `;
      } else if (type === 'expense') {
        card.innerHTML = `
          <div class="flex justify-between items-center pb-2 border-b border-slate-100">
            <h3 class="text-sm font-bold text-slate-900">+ Add Transaction</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">&times;</button>
          </div>
          <div class="space-y-3 pt-1">
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Transaction Description</label>
              <input id="newInputTitle" type="text" placeholder="e.g. Grocery store, Consulting fee" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE]" />
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Amount (₹)</label>
              <input id="newInputAmount" type="number" placeholder="1500" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE]" />
            </div>
            <div>
              <label class="text-[11px] font-semibold text-slate-600 block mb-1">Transaction Type</label>
              <select id="newInputType" class="w-full text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE] bg-white">
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
              </select>
            </div>
            <button onclick="submitNewExpense()" class="w-full py-2.5 bg-[#5C45EE] text-white rounded-full text-xs font-bold shadow-md hover:bg-[#4d36db] transition-colors">
              Save Transaction
            </button>
          </div>
        `;
      }

      overlay.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    function submitNewTask() {
      const title = document.getElementById('newInputTitle').value.trim();
      const area = document.getElementById('newInputArea').value;
      const cat = document.getElementById('newInputCategory').value;
      if (!title) return;
      tasks.unshift({
        id: 't_' + Date.now(),
        title: title,
        area: area,
        category: cat,
        time: '09:00 AM',
        completed: false
      });
      saveState();
      closeModal();
      renderCurrentScreen();
      showToast('Task added successfully');
    }

    function submitNewHabit() {
      const title = document.getElementById('newInputTitle').value.trim();
      const area = document.getElementById('newInputArea').value;
      const sched = document.getElementById('newInputSchedule').value;
      if (!title) return;
      habits.unshift({
        id: 'h_' + Date.now(),
        name: title,
        area: area,
        schedule: sched,
        frequency: sched,
        completed: false
      });
      saveState();
      closeModal();
      renderCurrentScreen();
      showToast('Habit added successfully');
    }

    function submitNewExpense() {
      const title = document.getElementById('newInputTitle').value.trim();
      const amt = parseFloat(document.getElementById('newInputAmount').value);
      const type = document.getElementById('newInputType').value;
      if (!title || isNaN(amt)) return;
      expenses.unshift({
        id: 'e_' + Date.now(),
        title: title,
        amount: amt,
        category: type === 'Income' ? 'Income' : 'General',
        type: type,
        date: 'Today'
      });
      saveState();
      closeModal();
      renderCurrentScreen();
      showToast(`${type} added successfully`);
    }

    // Router Render Function
    function renderCurrentScreen() {
      const vp = document.getElementById('screenViewport');
      switch (currentScreen) {
        case 'home': renderHomeScreen(vp); break;
        case 'health': renderHealthScreen(vp); break;
        case 'career': renderCareerScreen(vp); break;
        case 'finance': renderFinanceScreen(vp); break;
        case 'planning': renderPlanningScreen(vp); break;
        case 'habits': renderAllHabitsScreen(vp); break;
        case 'review': renderReviewScreen(vp); break;
        case 'settings': renderSettingsScreen(vp); break;
        default: renderHomeScreen(vp);
      }

            ${careerHabits.map(h => `
              <div onclick="toggleHabit('${h.id}')" class="py-2.5 flex items-center justify-between cursor-pointer">
                <div class="flex items-center gap-2.5 flex-1 min-w-0">
                  <input type="checkbox" ${h.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleHabit('${h.id}')" class="w-4 h-4 rounded text-[#5C45EE] accent-[#5C45EE]">
                  <span class="text-xs ${h.completed ? 'text-slate-400 line-through' : 'text-slate-800 font-medium'} truncate">${h.name}</span>
                </div>
                <span class="text-[9px] text-[#5C45EE] bg-[#EAE7FD] px-2 py-0.5 rounded-full font-semibold">Due today</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 4: Finance & Wealth Screen
    // ==========================================
    function renderFinanceScreen(vp) {
      const totalExpense = expenses.filter(e => e.type === 'Expense').reduce((acc, curr) => acc + curr.amount, 0);
      const totalIncome = expenses.filter(e => e.type === 'Income').reduce((acc, curr) => acc + curr.amount, 0);
      const netCash = totalIncome - totalExpense;
      const budgetAdherence = Math.max(0, Math.round(((monthlyBudget - totalExpense) / monthlyBudget) * 100));

      vp.innerHTML = `
        <div class="pt-1">
          <h1 class="text-lg font-bold text-slate-900">Finance & Wealth</h1>
          <p class="text-[11px] text-slate-500">Expenses, cash flow, budget adherence, and savings.</p>
        </div>

        <!-- Finance Hero Panel -->
        <div class="bg-[#DDD0F7] rounded-3xl p-5 shadow-xs">
          <p class="text-xs font-semibold text-slate-700">Net Cash Flow (Monthly)</p>
          <h2 class="text-3xl font-extrabold text-slate-900">+₹${netCash.toLocaleString()}</h2>
          <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-300/60 text-xs font-medium text-slate-700">
            <span>Income: ₹${totalIncome.toLocaleString()}</span>
            <span>Spent: ₹${totalExpense.toLocaleString()}</span>
          </div>
        </div>

        <!-- Budget Card -->
        <div class="bg-white rounded-3xl p-4 shadow-xs border border-slate-200/70">
          <div class="flex justify-between items-center mb-2">
            <div>
              <h4 class="text-xs font-bold text-slate-900">Monthly Budget (₹${monthlyBudget.toLocaleString()})</h4>
              <p class="text-[10px] text-slate-500">Spent ₹${totalExpense.toLocaleString()} of target</p>
            </div>
            <span class="text-xs font-bold ${budgetAdherence > 50 ? 'text-emerald-600' : 'text-amber-600'}">${budgetAdherence}% Left</span>
          </div>
          <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
            <div class="bg-[#5C45EE] h-full rounded-full" style="width: ${Math.min(100, Math.round((totalExpense / monthlyBudget) * 100))}%"></div>
          </div>
        </div>

        <!-- Action -->
        <button onclick="openModal('expense')" class="w-full py-2.5 bg-white rounded-full border border-slate-200 text-xs font-bold text-slate-800 flex items-center justify-center gap-1.5 shadow-xs">
          <span class="text-[#5C45EE]">+</span> Add transaction
        </button>

        <!-- Transactions List -->
        <div class="bg-white rounded-3xl p-4 shadow-xs border border-slate-200/70">
          <h3 class="text-sm font-bold text-slate-900 mb-2">Recent Transactions</h3>
          <div class="divide-y divide-slate-100">
            ${expenses.map(e => `
              <div class="py-2.5 flex justify-between items-center">
                <div>
                  <h4 class="text-xs font-bold text-slate-800">${e.title}</h4>
                  <span class="text-[10px] text-slate-400 font-medium">${e.category} · ${e.date || 'Today'}</span>
                </div>
                <span class="text-xs font-bold ${e.type === 'Income' ? 'text-emerald-600' : 'text-slate-900'}">
                  ${e.type === 'Income' ? '+' : '-'}₹${e.amount.toLocaleString()}
                </span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 5: Daily Planning Screen
    // ==========================================
    function renderPlanningScreen(vp) {
      vp.innerHTML = `
        <div class="pt-1">
          <h1 class="text-lg font-bold text-slate-900">Daily Planning</h1>
          <p class="text-[11px] text-slate-500">Plan and schedule tasks for today.</p>
        </div>

        <!-- Summary -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs flex justify-between items-center">
          <div>
            <span class="text-xs text-slate-500 font-medium">Total Planned</span>
            <h3 class="text-lg font-extrabold text-slate-900">${tasks.length} Tasks</h3>
          </div>
          <div>
            <span class="text-xs text-slate-500 font-medium">Completed</span>
            <h3 class="text-lg font-extrabold text-[#5C45EE]">${tasks.filter(t => t.completed).length} Done</h3>
          </div>
          <button onclick="openModal('task')" class="px-3 py-1.5 bg-[#5C45EE] text-white rounded-full text-xs font-bold shadow-xs">
            + New
          </button>
        </div>

        <!-- Task List -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-2.5">
          <h3 class="text-xs font-bold text-slate-700">Planned Tasks</h3>
          ${tasks.length === 0 ? `
            <p class="text-xs text-slate-400 py-3 text-center">No tasks planned. Tap '+ New' to add a task.</p>
          ` : tasks.map(t => `
            <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FAF9FF] border border-slate-100">
              <div class="flex items-center gap-3 flex-1 min-w-0" onclick="toggleTask('${t.id}')">
                <input type="checkbox" ${t.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask('${t.id}')" class="w-4 h-4 rounded text-[#5C45EE] accent-[#5C45EE]">
                <div class="min-w-0">
                  <h4 class="text-xs ${t.completed ? 'text-slate-400 line-through' : 'text-slate-800 font-semibold'} truncate">${t.title}</h4>
                  <span class="text-[10px] text-slate-400">${t.area} · ${t.category}</span>
                </div>
              </div>
              <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-rose-500 text-xs px-2 py-1">✕</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ==========================================
    // SCREEN 6: All Habits Manager Screen
    // ==========================================
    function renderAllHabitsScreen(vp) {
      vp.innerHTML = `
        <div class="pt-1">
          <h1 class="text-lg font-bold text-slate-900">Habits Manager</h1>
          <p class="text-[11px] text-slate-500">Configure schedules and recurring routines.</p>
        </div>

        <button onclick="openModal('habit')" class="w-full py-2.5 bg-[#5C45EE] text-white rounded-full text-xs font-bold shadow-md hover:bg-[#4d36db] transition-colors">
          + Add New Habit
        </button>

        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs divide-y divide-slate-100">
          ${habits.map(h => `
            <div class="py-3 flex items-center justify-between">
              <div>
                <h4 class="text-xs font-bold text-slate-800">${h.name}</h4>
                <div class="flex items-center gap-2 mt-0.5">
                  <span class="text-[10px] text-slate-400 font-medium">${h.schedule || 'Daily'}</span>
                  <span class="text-[9px] px-1.5 py-0.2 bg-slate-100 text-slate-600 rounded font-semibold">${h.area}</span>
                </div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="toggleHabit('${h.id}')" class="text-xs px-2.5 py-1 rounded-full ${h.completed ? 'bg-emerald-100 text-emerald-700 font-bold' : 'bg-slate-100 text-slate-600'}">
                  ${h.completed ? 'Done' : 'Pending'}
                </button>
                <button onclick="deleteHabit('${h.id}')" class="text-slate-300 hover:text-rose-500 text-xs px-1">✕</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // ==========================================
    // SCREEN 7: Daily Review Screen
    // ==========================================
    function renderReviewScreen(vp) {
      vp.innerHTML = `
        <div class="pt-1">
          <h1 class="text-lg font-bold text-slate-900">Daily Review</h1>
          <p class="text-[11px] text-slate-500">Reflect on your achievements and daily progress.</p>
        </div>

        <!-- Mood Selector -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-2">
          <label class="text-xs font-bold text-slate-800">How was your day?</label>
          <div class="grid grid-cols-4 gap-2 pt-1">
            ${['Great', 'Good', 'Okay', 'Tough'].map(m => `
              <button onclick="dailyMood='${m}'; saveState(); renderCurrentScreen(); showToast('Mood saved: ${m}')" class="py-2 rounded-2xl text-xs font-bold border transition-all ${dailyMood === m ? 'bg-[#5C45EE] text-white border-[#5C45EE] shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">
                ${m === 'Great' ? '🌟 ' : m === 'Good' ? '😊 ' : m === 'Okay' ? '😐 ' : '🌧️ '}${m}
              </button>
            `).join('')}
          </div>
        </div>

        <!-- Reflection Notes -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-2">
          <label class="text-xs font-bold text-slate-800">Daily Reflection Notes</label>
          <textarea id="reviewTextarea" rows="4" class="w-full text-xs p-3 rounded-2xl border border-slate-200 focus:outline-[#5C45EE] resize-none" placeholder="What went well today? What can improve?">${dailyReviewNotes}</textarea>
          <button onclick="dailyReviewNotes=document.getElementById('reviewTextarea').value; saveState(); showToast('Review notes saved!')" class="w-full py-2 bg-slate-900 text-white rounded-full text-xs font-bold shadow-xs">
            Save Review
          </button>
        </div>

        <!-- Daily Summary Stats -->
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-white rounded-2xl p-3 border border-slate-200 text-center">
            <span class="text-[10px] text-slate-400 font-semibold uppercase">Habits Done</span>
            <p class="text-base font-extrabold text-slate-900 mt-0.5">${habits.filter(h => h.completed).length} / ${habits.length}</p>
          </div>
          <div class="bg-white rounded-2xl p-3 border border-slate-200 text-center">
            <span class="text-[10px] text-slate-400 font-semibold uppercase">Tasks Done</span>
            <p class="text-base font-extrabold text-slate-900 mt-0.5">${tasks.filter(t => t.completed).length} / ${tasks.length}</p>
          </div>
        </div>
      `;
    }

    // ==========================================
    // SCREEN 8: Settings Screen
    // ==========================================
    function renderSettingsScreen(vp) {
      vp.innerHTML = `
        <div class="pt-1">
          <h1 class="text-lg font-bold text-slate-900">Settings</h1>
          <p class="text-[11px] text-slate-500">Preferences, targets, and data management.</p>
        </div>

        <!-- Monthly Budget Target -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-3">
          <h3 class="text-xs font-bold text-slate-900">Finance Budget Target</h3>
          <div>
            <label class="text-[10px] text-slate-500 block mb-1">Monthly Budget Limit (₹)</label>
            <div class="flex gap-2">
              <input id="budgetInput" type="number" value="${monthlyBudget}" class="flex-1 text-xs p-2.5 rounded-xl border border-slate-200 focus:outline-[#5C45EE]" />
              <button onclick="monthlyBudget=parseInt(document.getElementById('budgetInput').value)||45000; saveState(); showToast('Budget updated!'); renderCurrentScreen();" class="px-4 py-2 bg-[#5C45EE] text-white rounded-xl text-xs font-bold">Save</button>
            </div>
          </div>
        </div>

        <!-- Sample Dataset Manager -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-xs space-y-2">
          <h3 class="text-xs font-bold text-slate-900">Demo Sample Dataset</h3>
          <p class="text-[10px] text-slate-500">Reset or purge all mock demo data anytime to start clean.</p>
          <div class="pt-1 flex gap-2">
            <button onclick="resetPrototypeData()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-800 rounded-xl text-xs font-bold transition-colors">
              Reset Sample Month
            </button>
          </div>
        </div>

        <!-- App Info -->
        <div class="p-3 text-center">
          <p class="text-[10px] text-slate-400 font-semibold">Life Analytics Web Prototype v1.2.0</p>
          <p class="text-[9px] text-slate-400">Isolated rapid-prototyping sandbox</p>
        </div>
      `;
    }

    // Initialize View
    renderCurrentScreen();
  </script>
</body>
</html>
